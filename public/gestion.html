<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B3D2C">
<link rel="icon" href="/icon.svg">
<title>Gestion du restaurant</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/admin.css">
<style>
/* ----- Commandes (colonnes) ----- */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;}
.col{background:#EAE6E0;border-radius:22px;padding:12px;min-height:300px;}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px;}
.col-h .h{font-size:22px;}
.col-h .n{background:#fff;border-radius:999px;padding:3px 11px;font-weight:800;font-size:13px;}
.col.c1 .col-h .n{background:var(--rouge);color:#fff;}
.oc{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 0 var(--gris2);}
.oc.new{box-shadow:0 0 0 3px var(--rouge);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(225,6,0,.25);}}
.oc-h{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.oc-h .h{font-size:24px;}
.oc .age{font-size:12px;color:var(--gris4);font-weight:600;}
.oc .who{margin-top:6px;font-size:13.5px;}
.oc .who a{font-weight:700;text-decoration:none;}
.oc .where{font-size:13px;color:var(--gris4);margin-top:3px;line-height:1.35;}
.oc ul{list-style:none;margin:10px 0;border-top:1px dashed var(--gris2);padding-top:8px;}
.oc li{padding:3px 0;font-size:14px;}
.oc li b{font-weight:800;}
.oc li small{display:block;color:var(--gris4);font-size:12.5px;padding-left:22px;}
.oc li em{display:block;color:var(--rouge2);font-size:12.5px;padding-left:22px;font-style:normal;font-weight:600;}
.oc .onote{background:var(--jaunep);border-radius:10px;padding:7px 10px;font-size:13px;margin-bottom:8px;}
.oc-f{display:flex;justify-content:space-between;align-items:center;font-weight:800;}
.oc-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.oc-a .btn{flex:1;}
.col-empty{text-align:center;color:var(--gris4);font-size:13px;padding:30px 10px;}
.soundbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ----- Menu ----- */
.catrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gris);}
.catrow:last-child{border-bottom:none;}
.menu-grid{grid-template-columns:420px 1fr;}
.menu-grid>*{min-width:0;}
@media(max-width:1250px){.menu-grid{grid-template-columns:1fr;}}
.catrow .cn{flex:1;font-weight:700;min-width:0;}
.catrow .cn small{display:block;font-weight:500;color:var(--gris4);}
.pl-name b{display:block;}
.pl-name small{display:block;color:var(--gris4);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.off td{opacity:.55;}
.off td:nth-child(4),.off td:nth-child(5){opacity:1;}
.og{background:#fff;border:1.5px solid var(--gris2);border-radius:16px;padding:12px;margin-bottom:10px;}
.og .row{align-items:center;}
.chx{display:flex;gap:8px;align-items:center;margin-top:6px;}
.chx input{padding:8px 10px;border-radius:10px;border:1.5px solid var(--gris2);outline:none;}
.chx input:first-child{flex:1;}
.chx input:nth-child(2){width:110px;}
.xbtn{width:30px;height:30px;border-radius:50%;background:var(--gris);font-weight:700;flex-shrink:0;}

/* ----- Bannières ----- */
.bans{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.ban{height:160px;border-radius:20px;position:relative;overflow:hidden;color:#fff;background:var(--vert2);display:flex;align-items:flex-end;}
.ban.rouge{background:var(--rouge);}
.ban.jaune{background:var(--jaune);color:var(--noir);}
.ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ban.has-img::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,61,44,.92) 0%,rgba(11,61,44,.55) 48%,rgba(0,0,0,0) 78%);}
.ban .d1{position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1);}
.ban .d2{position:absolute;right:-24px;bottom:-70px;width:140px;height:140px;border-radius:50%;border:20px solid var(--rouge);}
.ban.rouge .d2{border-color:var(--jaune);}
.ban.jaune .d2{border-color:var(--rouge);}
.ban .bt{position:relative;z-index:2;padding:16px;max-width:74%;}
.ban .bt .h{font-size:25px;margin-bottom:5px;}
.ban .bt p{font-size:13px;line-height:1.3;}
.ban-c{background:#fff;border-radius:22px;padding:10px;}
.ban-c.off .ban{opacity:.45;filter:grayscale(.6);}
.ban-a{display:flex;align-items:center;gap:8px;padding:10px 4px 2px;flex-wrap:wrap;}
.colpick{display:flex;gap:8px;}
.colpick button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;}
.colpick button.on{border-color:var(--noir);}

/* ----- Messages ----- */
.days{display:flex;gap:5px;flex-wrap:wrap;}
.days button{width:36px;height:36px;border-radius:50%;background:var(--gris);font-weight:800;font-size:13px;}
.days button.on{background:var(--vert);color:#fff;}
.prog{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--gris);flex-wrap:wrap;}
.prog:last-child{border-bottom:none;}
.prog .hr{font-family:var(--fh);font-weight:800;font-size:34px;min-width:90px;}
.prog .tx{flex:1;min-width:220px;}
.prog .tx b{display:block;}
.prog .tx p{color:var(--gris4);font-size:13.5px;margin-top:2px;}
.ins{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px;}
.ins button{padding:5px 10px;border-radius:8px;background:var(--jaunep);font-size:12px;font-weight:700;}

/* ----- Discussions ----- */
.chatw{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 240px);min-height:420px;}
@media(max-width:800px){.chatw{grid-template-columns:1fr;height:auto;}}
.convs{background:#fff;border-radius:20px;overflow-y:auto;}
.conv{padding:14px 16px;border-bottom:1px solid var(--gris);cursor:pointer;display:flex;gap:10px;align-items:center;}
.conv:hover{background:#FCFBF9;}
.conv.on{background:var(--vertp);}
.conv .av{width:40px;height:40px;border-radius:50%;background:var(--vert);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.conv .ci{flex:1;min-width:0;}
.conv .ci b{display:block;}
.conv .ci small{display:block;color:var(--gris4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thread{background:#fff;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:420px;}
.thread-h{padding:14px 18px;border-bottom:1px solid var(--gris);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--creme);}
.msg{max-width:75%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.35;word-wrap:break-word;}
.msg.cl{align-self:flex-start;background:#fff;box-shadow:0 1px 0 var(--gris2);border-bottom-left-radius:5px;}
.msg.re{align-self:flex-end;background:var(--vert);color:#fff;border-bottom-right-radius:5px;}
.msg time{display:block;font-size:11px;opacity:.6;margin-top:2px;}
.thread-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--gris);}
.thread-f input{flex:1;padding:12px 16px;border-radius:999px;border:1.5px solid var(--gris2);outline:none;}

/* ----- Tables QR ----- */
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.qr{background:#fff;border-radius:22px;padding:16px;text-align:center;border:2px solid var(--vert);break-inside:avoid;position:relative;overflow:hidden;}
.qr::before{content:'';position:absolute;left:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--rouge);}
.qr .h{font-size:34px;position:relative;}
.qr svg{width:150px;height:150px;margin:8px auto;display:block;}
.qr p{font-size:13px;font-weight:600;}
.qr small{display:block;color:var(--gris4);font-size:11.5px;margin-top:3px;}
@media print{body.print-qr .panel:not(#p-tables){display:none !important;}body.print-qr .qr-tools{display:none;}.qrs{grid-template-columns:repeat(3,1fr);}}

.resa-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.devis{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.dv .k{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;border-bottom:1px solid var(--gris);}
.dv .k span{color:var(--gris4);}
.dv .desc{background:var(--gris);border-radius:12px;padding:10px;font-size:13.5px;margin:10px 0;white-space:pre-wrap;}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"></div>
  <div class="brand"><div class="h" id="g-nom">Gestion</div><small>Espace de la responsable · <span class="live" id="live"><i></i><span>connexion…</span></span></small></div>
  <div class="tb-r">
    <button class="openbtn on" id="g-open" onclick="toggleOpen()"><i></i><span>Ouvert</span></button>
    <a class="tb-btn red" href="/caisse.html">Caisse</a>
    <a class="tb-btn" href="/" target="_blank">App client</a>
    <button class="tb-btn" onclick="logout()">Déconnexion</button>
  </div>
</header>
<nav class="nav" id="nav">
  <button class="nb on" data-p="commandes">Commandes <span class="cnt" id="n-cmd"></span></button>
  <button class="nb" data-p="menu">Menus & plats</button>
  <button class="nb" data-p="bannieres">Bannières</button>
  <button class="nb" data-p="messages">Messages clients</button>
  <button class="nb" data-p="reservations">Réservations <span class="cnt" id="n-resa"></span></button>
  <button class="nb" data-p="devis">Devis événements <span class="cnt" id="n-devis"></span></button>
  <button class="nb" data-p="discussions">Discussions <span class="cnt" id="n-chat"></span></button>
  <button class="nb" data-p="clients">Clients</button>
  <button class="nb" data-p="tables">Tables & QR codes</button>
  <button class="nb" data-p="reglages">Réglages</button>
</nav>
<main class="content">
  <section class="panel on" id="p-commandes"></section>
  <section class="panel" id="p-menu"></section>
  <section class="panel" id="p-bannieres"></section>
  <section class="panel" id="p-messages"></section>
  <section class="panel" id="p-reservations"></section>
  <section class="panel" id="p-devis"></section>
  <section class="panel" id="p-discussions"></section>
  <section class="panel" id="p-clients"></section>
  <section class="panel" id="p-tables"></section>
  <section class="panel" id="p-reglages"></section>
</main>

<script src="/vendor/qrcode.js"></script>
<script src="/admin-commun.js"></script>
<script>
let G = null;           // toutes les données
let P = 'commandes';    // panneau affiché
let soundOn = true, audioCtx = null;
const ST = { recue: 'Nouvelle', acceptee: 'Acceptée', preparation: 'En cuisine', prete: 'Prête', en_livraison: 'En livraison', terminee: 'Terminée', annulee: 'Annulée' };
const MODE = { livraison: 'Livraison', sur_place: 'Sur place', emporter: 'À emporter' };
const JOURS = [[1, 'L'], [2, 'M'], [3, 'M'], [4, 'J'], [5, 'V'], [6, 'S'], [0, 'D']];
const byId = (arr, id) => arr.find(x => x.id === Number(id));
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); };

// ===================================================================
// DÉMARRAGE
// ===================================================================
document.querySelectorAll('#nav .nb').forEach(b => b.onclick = () => showPanel(b.dataset.p));
function showPanel(p) {
  P = p;
  document.querySelectorAll('#nav .nb').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  document.querySelectorAll('.panel').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  render();
  try { localStorage.setItem('g_panel', p); } catch (e) { }
}
async function load() {
  G = await api('/api/admin/bootstrap');
  $('g-nom').textContent = G.settings.resto.nom;
  document.title = 'Gestion — ' + G.settings.resto.nom;
  renderOpen();
}
adminBoot(async () => {
  await load();
  let p = 'commandes'; try { p = localStorage.getItem('g_panel') || p; } catch (e) { }
  showPanel(p);
  adminStream({
    commande: c => { upsert(G.commandes, c); if (P === 'commandes') render(); badges(); },
    nouvelle: n => { alertNew(n); },
    client: c => { upsert(G.clients, c); },
    chat: m => { const c = Object.assign({}, m); delete c.clientNom; delete c.clientTel; upsert(G.chats, c);
      if (!G.clients.some(x => x.id === m.clientId)) G.clients.push({ id: m.clientId, nom: m.clientNom, tel: m.clientTel });
      if (m.de === 'client') { ding(1); if (P !== 'discussions' || CUR_CHAT !== m.clientId) toast('Message de ' + m.clientNom, m.texte); }
      if (P === 'discussions') { renderDiscussions(true); } badges(); },
    reservation: r => { const isNew = !G.reservations.some(x => x.id === r.id); upsert(G.reservations, r); if (isNew) { ding(1); toast('Nouvelle réservation', `${r.nom} · ${dmy(r.date)} ${r.heure} · ${r.personnes} pers.`); } if (P === 'reservations') render(); badges(); },
    devis: d => { const isNew = !G.devis.some(x => x.id === d.id); const old = G.devis.find(x => x.id === d.id); upsert(G.devis, d);
      if (isNew) { ding(1); toast('Nouvelle demande de devis', `${d.nom} · ${d.evenement} · ${d.invites} invités`); }
      else if (old && old.statut !== d.statut && (d.statut === 'accepte' || d.statut === 'refuse')) toast('Devis ' + (d.statut === 'accepte' ? 'accepté' : 'refusé') + ' par le client', d.nom + ' · ' + d.evenement);
      if (P === 'devis') render(); badges(); },
    mouvement: () => { },
    alerte: a => toast(a.titre, a.corps, true),
    position: d => { const c = byId(G.commandes, d.id); if (c) c.livreurPos = d.pos; }
  }, on => { $('live').classList.toggle('on', on); $('live').querySelector('span').textContent = on ? 'en direct' : 'reconnexion…'; if (on && G) load().then(() => render()); });
  setInterval(() => { document.querySelectorAll('[data-age]').forEach(el => el.textContent = ago(el.dataset.age)); }, 30000);
  setInterval(() => { if (soundOn && G.commandes.some(c => c.statut === 'recue')) ding(2); }, 20000);
});
function render() {
  if (!G) return;
  ({ commandes: renderCommandes, menu: renderMenu, bannieres: renderBanners, messages: renderMessages, reservations: renderResas, devis: renderDevis,
    discussions: renderDiscussions, clients: renderClients, tables: renderTables, reglages: renderReglages })[P]();
  badges();
}
function badges() {
  const nc = G.commandes.filter(c => c.statut === 'recue').length;
  $('n-cmd').textContent = nc || '';
  $('n-resa').textContent = G.reservations.filter(r => r.statut === 'demandee').length || '';
  $('n-devis').textContent = G.devis.filter(d => d.statut === 'nouveau').length || '';
  $('n-chat').textContent = G.chats.filter(m => m.de === 'client' && !m.lu).length || '';
  document.title = (nc ? `(${nc}) ` : '') + 'Gestion — ' + G.settings.resto.nom;
}

// Sons et alertes
function ding(kind) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 2 ? [880, 1175, 880, 1175] : [784, 1046];
    notes.forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); const t = audioCtx.currentTime + i * .17; o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .3); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .32); });
  } catch (e) { }
}
document.addEventListener('click', () => { if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }, { once: true });
function alertNew(n) {
  ding(2);
  toast(`Nouvelle commande n° ${n.numero}`, `${n.client} · ${MODE[n.mode]}${n.table ? ' table ' + n.table : ''} · ${F(n.total)}`);
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try { new Notification(`Nouvelle commande n° ${n.numero}`, { body: `${n.client} · ${F(n.total)}`, icon: '/icon.svg' }); } catch (e) { }
  }
}
function ago(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'à l’instant' : m < 60 ? `il y a ${m} min` : `il y a ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}

// Ouvert / fermé (visible côté client immédiatement)
function renderOpen() {
  const o = G.settings.resto.ouvert, b = $('g-open');
  b.className = 'openbtn ' + (o ? 'on' : 'off'); b.querySelector('span').textContent = o ? 'Ouvert — prend les commandes' : 'Fermé';
}
async function toggleOpen() {
  const o = !G.settings.resto.ouvert;
  if (!o && !confirm('Fermer le restaurant ? Les clients ne pourront plus commander.')) return;
  try { const r = await api('/api/admin/resto', { method: 'PUT', body: { ouvert: o } }); G.settings.resto = r.resto; renderOpen(); toast(o ? 'Restaurant ouvert' : 'Restaurant fermé', o ? 'Les clients peuvent commander.' : 'L’app affiche « Actuellement fermé ».'); }
  catch (e) { toast('Erreur', e.message, true); }
}

// ===================================================================
// COMMANDES
// ===================================================================
function renderCommandes() {
  const td = todayStr();
  const today = G.commandes.filter(c => c.date === td || new Date(c.at).toDateString() === new Date().toDateString());
  const done = today.filter(c => c.statut === 'terminee');
  const ca = done.reduce((s, c) => s + c.total, 0);
  const cols = [
    ['c1', 'Nouvelles', c => c.statut === 'recue'],
    ['c2', 'En cuisine', c => c.statut === 'acceptee' || c.statut === 'preparation'],
    ['c3', 'Prêtes', c => c.statut === 'prete'],
    ['c4', 'En livraison', c => c.statut === 'en_livraison']
  ];
  const active = G.commandes.filter(c => !['terminee', 'annulee'].includes(c.statut));
  $('p-commandes').innerHTML = `
    <div class="ph-t"><div><div class="h">Commandes en direct</div><p>Les commandes de l’app et des tables arrivent ici instantanément. Une commande terminée part automatiquement en caisse.</p></div>
      <div class="soundbar"><button class="btn ${soundOn ? 'vert' : 'ghost'} sm" onclick="soundOn=!soundOn;render();if(soundOn)ding(1)">Son ${soundOn ? 'activé' : 'coupé'}</button>
      ${'Notification' in window && Notification.permission === 'default' ? '<button class="btn ghost sm" onclick="Notification.requestPermission().then(render)">Alertes bureau</button>' : ''}
      <button class="btn" onclick="openComptoir()">+ Commande comptoir</button></div></div>
    <div class="kpis">
      <div class="kpi vert"><div class="l">Commandes du jour</div><div class="v">${today.filter(c => c.statut !== 'annulee').length}</div><div class="s">${active.length} en cours</div></div>
      <div class="kpi"><div class="l">Encaissé aujourd’hui</div><div class="v">${F(ca)}</div><div class="s">${done.length} terminée(s)</div></div>
      <div class="kpi jaune"><div class="l">Panier moyen</div><div class="v">${F(done.length ? ca / done.length : 0)}</div><div class="s">sur les commandes terminées</div></div>
      <div class="kpi rouge"><div class="l">Annulées</div><div class="v">${today.filter(c => c.statut === 'annulee').length}</div><div class="s">aujourd’hui</div></div>
    </div>
    <div class="board">${cols.map(([k, t, f]) => { const list = active.filter(f).sort((a, b) => a.id - b.id); return `<div class="col ${k}"><div class="col-h"><span class="h">${t}</span><span class="n">${list.length}</span></div>${list.length ? list.map(ocard).join('') : '<div class="col-empty">Aucune commande</div>'}</div>`; }).join('')}</div>
    <div class="card" style="margin-top:18px"><div class="card-t">Terminées et annulées aujourd’hui</div>
      ${today.filter(c => ['terminee', 'annulee'].includes(c.statut)).length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>N°</th><th>Heure</th><th>Client</th><th>Mode</th><th>Articles</th><th>Paiement</th><th class="num">Total</th><th>Statut</th><th>Avis</th><th></th></tr></thead><tbody>
      ${today.filter(c => ['terminee', 'annulee'].includes(c.statut)).reverse().map(c => `<tr><td><b>${c.numero}</b></td><td>${fheure(c.at)}</td><td>${esc(c.clientNom)}</td><td>${MODE[c.mode]}${c.table ? ' · T' + c.table : ''}</td>
        <td style="max-width:280px">${esc(c.lignes.map(l => l.qte + '× ' + l.nom).join(', '))}</td><td>${PAY_LABEL[c.paiement] || c.paiement}</td><td class="num"><b>${F(c.total)}</b></td>
        <td><span class="badge ${c.statut === 'terminee' ? 'vert' : 'rouge'}">${ST[c.statut]}</span></td><td>${c.avis ? '★ ' + c.avis.note + (c.avis.commentaire ? ' — ' + esc(c.avis.commentaire) : '') : ''}</td>
        <td><button class="btn ghost sm" onclick="ticket(${c.id})">Ticket</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Rien pour le moment.</div>'}
    </div>`;
}
function ocard(c) {
  const where = c.mode === 'livraison' ? `${esc(c.adresse || '')}${c.position ? ` · <a href="https://www.google.com/maps?q=${c.position.lat},${c.position.lng}" target="_blank">Voir sur la carte</a>` : ''}`
    : c.mode === 'sur_place' ? `<b style="color:var(--noir);font-size:15px">Table ${c.table}</b>` : 'À emporter — récupère au comptoir';
  const next = {

    preparation: `<button class="btn" onclick="statut(${c.id},'prete')">C’est prêt</button>`,
    prete: c.mode === 'livraison' ? `<button class="btn vert" onclick="statut(${c.id},'en_livraison')">Confier au livreur</button>` : `<button class="btn vert" onclick="statut(${c.id},'terminee')">${c.mode === 'sur_place' ? 'Servie et payée' : 'Remise au client'}</button>`,
    en_livraison: `<button class="btn ghost" onclick="lienLivreur(${c.id})">Lien livreur</button><button class="btn vert" onclick="statut(${c.id},'terminee')">Livrée et payée</button>`
  }[c.statut] || '';
  return `<div class="oc ${c.statut === 'recue' ? 'new' : ''}">
    <div class="oc-h"><span class="h">N° ${c.numero}</span><span class="badge ${c.mode === 'livraison' ? 'jaune' : c.mode === 'sur_place' ? 'vert' : ''}">${MODE[c.mode]}</span></div>
    <div class="age" data-age="${c.at}">${ago(c.at)}</div>
    <div class="who">${esc(c.clientNom)}${c.tel ? ` · <a href="tel:${esc(c.tel)}">${esc(c.tel)}</a>` : ''}${c.source === 'comptoir' ? ' · <span class="badge">Comptoir</span>' : ''}</div>
    <div class="where">${where}</div>
    <ul>${c.lignes.map(l => `<li><b>${l.qte} ×</b> ${esc(l.nom)}${l.options.length ? `<small>${esc(l.options.map(o => o.choix).join(' · '))}</small>` : ''}${l.note ? `<em>« ${esc(l.note)} »</em>` : ''}</li>`).join('')}</ul>
    ${c.note ? `<div class="onote">${esc(c.note)}</div>` : ''}

    <div class="oc-a"><button class="btn line sm" onclick="ticket(${c.id})">Ticket cuisine</button>${c.statut !== 'recue' ? `<button class="btn line sm" onclick="refuser(${c.id})">Annuler</button>` : ''}</div>
  </div>`;
}
async function statut(id, s) {
  try {
    const r = await api(`/api/admin/commandes/${id}/statut`, { body: { statut: s } }); upsert(G.commandes, r.commande); render();
    if (s === 'en_livraison') lienLivreur(id);
    if (s === 'terminee') toast('Commande terminée', `N° ${r.commande.numero} enregistrée en caisse : ${F(r.commande.total)}`);
  } catch (e) { toast('Impossible', e.message, true); }
}
function refuser(id) { const c = byId(G.commandes, id); if (confirm(`Annuler la commande n° ${c.numero} ? Le client sera prévenu.`)) statut(id, 'annulee'); }
function lienLivreur(id) {
  const c = byId(G.commandes, id);
  const url = `${location.origin}/livreur.html?c=${c.id}&k=${c.livreurKey}`;
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const msg = `Course n° ${c.numero} — ${c.clientNom}, ${c.adresse || 'position GPS'}. Ouvrez ce lien et partagez votre position : ${url}`;
  openModal(`<div class="mt h">Lien du livreur</div>
    <p class="hint">Le livreur ouvre ce lien sur son téléphone et appuie sur « Démarrer ». Le client voit alors sa position en direct sur la carte.</p>
    <div style="text-align:center;margin:14px 0">${q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }).replace('<svg ', '<svg style="width:210px;height:210px" ')}</div>
    <div class="fld"><input value="${esc(url)}" readonly onclick="this.select()"></div>
    <div class="mfoot"><button class="btn ghost" onclick="navigator.clipboard.writeText('${esc(url)}').then(()=>toast('Lien copié',''))">Copier le lien</button>
    <a class="btn vert" target="_blank" href="https://wa.me/?text=${encodeURIComponent(msg)}" style="text-decoration:none">Envoyer par WhatsApp</a></div>`);
}
function ticket(id) {
  const c = byId(G.commandes, id), r = G.settings.resto;
  const w = window.open('', '_blank', 'width=380,height=640');
  w.document.write(`<html><head><title>Ticket ${c.numero}</title><style>body{font-family:monospace;width:72mm;margin:0 auto;padding:8px;font-size:13px}h1{font-size:18px;text-align:center;margin:4px 0}hr{border:none;border-top:1px dashed #000}.r{display:flex;justify-content:space-between}small{display:block;padding-left:14px}.big{font-size:22px;font-weight:bold;text-align:center}</style></head><body>
    <h1>${esc(r.nom)}</h1><div class="big">N° ${c.numero}</div><div style="text-align:center">${MODE[c.mode]}${c.table ? ' — TABLE ' + c.table : ''}<br>${fdt(c.at)}</div><hr>
    <div>${esc(c.clientNom)} ${esc(c.tel || '')}</div>${c.adresse ? `<div>${esc(c.adresse)}</div>` : ''}<hr>
    ${c.lignes.map(l => `<div class="r"><span>${l.qte} x ${esc(l.nom)}</span><span>${F(l.total)}</span></div>${l.options.map(o => `<small>- ${esc(o.choix)}</small>`).join('')}${l.note ? `<small>* ${esc(l.note)}</small>` : ''}`).join('')}
    <hr>${c.frais ? `<div class="r"><span>Livraison</span><span>${F(c.frais)}</span></div>` : ''}${c.remise ? `<div class="r"><span>Fidélité</span><span>-${F(c.remise)}</span></div>` : ''}
    <div class="r" style="font-weight:bold;font-size:16px"><span>TOTAL</span><span>${F(c.total)}</span></div><div>Paiement : ${PAY_LABEL[c.paiement] || ''}</div>${c.note ? `<hr><div>Note : ${esc(c.note)}</div>` : ''}<hr><div style="text-align:center">Merci et bon appétit !</div>
    <script>window.onload=()=>{window.print();}<\/script></body></html>`);
  w.document.close();
}
// Commande saisie au comptoir / au téléphone
let CPT = [];
function openComptoir() { CPT = []; drawComptoir(); }
function drawComptoir() {
  const plats = G.plats.filter(p => p.actif);
  const tot = CPT.reduce((s, l) => s + lineUnit(l) * l.qte, 0);
  openModal(`<div class="mt h">Commande comptoir</div>
    <div class="grid2"><div style="max-height:52vh;overflow:auto">${G.categories.map(cat => { const ps = plats.filter(p => p.categorieId === cat.id); return ps.length ? `<div style="font-weight:800;margin:8px 0 4px">${esc(cat.nom)}</div>` + ps.map(p => `<button class="btn line sm" style="margin:0 4px 4px 0" onclick="cptAdd(${p.id})">${esc(p.nom)} · ${F(p.prix)}</button>`).join('') : ''; }).join('')}</div>
    <div><div style="font-weight:800;margin:8px 0">Commande</div>${CPT.length ? CPT.map((l, i) => { const p = byId(G.plats, l.platId); return `<div class="og"><div class="row" style="justify-content:space-between"><b>${esc(p.nom)}</b><span><button class="xbtn" onclick="CPT[${i}].qte=Math.max(1,CPT[${i}].qte-1);drawComptoir()">−</button> <b>${l.qte}</b> <button class="xbtn" onclick="CPT[${i}].qte++;drawComptoir()">+</button> <button class="xbtn" onclick="CPT.splice(${i},1);drawComptoir()">×</button></span></div>
      ${(p.options || []).filter(g => g.type === 'single').map(g => `<div class="chx"><small style="width:110px">${esc(g.nom)}</small><select onchange="CPT[${i}].options['${g.id}']=this.value?[this.value]:[];drawComptoir()" style="flex:1;padding:6px;border-radius:8px;border:1.5px solid var(--gris2)">${g.requis ? '' : '<option value="">—</option>'}${g.choix.map(ch => `<option value="${ch.id}" ${(l.options[g.id] || [])[0] === ch.id ? 'selected' : ''}>${esc(ch.nom)}${ch.prix ? ' +' + F(ch.prix) : ''}</option>`).join('')}</select></div>`).join('')}</div>`; }).join('') : '<div class="hint">Cliquez sur les plats à gauche.</div>'}
      <div class="row"><div class="fld"><label>Mode</label><select id="cp-mode"><option value="sur_place">Sur place</option><option value="emporter">À emporter</option><option value="livraison">Livraison</option></select></div><div class="fld"><label>Table</label><input id="cp-table" type="number" min="0"></div></div>
      <div class="row"><div class="fld"><label>Client</label><input id="cp-nom" placeholder="Nom (facultatif)"></div><div class="fld"><label>Téléphone</label><input id="cp-tel"></div></div>
      <div class="fld"><label>Paiement</label><select id="cp-pay">${Object.entries(PAY_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="err" id="cp-err"></div>
      <button class="btn big full" onclick="cptSend()">Envoyer en cuisine · ${F(tot)}</button></div></div>`, true);
}
function lineUnit(l) { const p = byId(G.plats, l.platId); let u = p.prix; (p.options || []).forEach(g => (l.options[g.id] || []).forEach(cid => { const c = g.choix.find(x => x.id === cid); if (c) u += c.prix; })); return u; }
function cptAdd(id) { const p = byId(G.plats, id); const o = {}; (p.options || []).forEach(g => { o[g.id] = g.type === 'single' && g.requis ? [g.choix[0].id] : []; }); CPT.push({ platId: id, qte: 1, options: o }); drawComptoir(); }
async function cptSend() {
  try {
    const r = await api('/api/admin/commandes', { body: { items: CPT, mode: $('cp-mode').value, table: $('cp-table').value, clientNom: $('cp-nom').value, tel: $('cp-tel').value, paiement: $('cp-pay').value, adresse: '' } });
    upsert(G.commandes, r.commande); closeModal(); render(); toast('Commande envoyée en cuisine', 'N° ' + r.commande.numero);
  } catch (e) { $('cp-err').textContent = e.message; }
}

async function patchPlat(id, body) { try { const r = await api('/api/admin/plats/' + id, { method: 'PUT', body }); upsert(G.plats, r.plat); renderMenuList(); toast(body.actif !== undefined ? (body.actif ? 'Plat disponible' : 'Plat retiré de l’app') : (body.platDuJour ? 'Ajouté aux plats du jour' : 'Retiré des plats du jour'), r.plat.nom); } catch (e) { toast('Erreur', e.message, true); } }
async function patchCat(id, body) { try { const r = await api('/api/admin/categories/' + id, { method: 'PUT', body }); upsert(G.categories, r.categorie); renderMenu(); } catch (e) { toast('Erreur', e.message, true); } }
async function moveCat(id, d) {
  const cats = G.categories.slice().sort((a, b) => a.ordre - b.ordre); const i = cats.findIndex(c => c.id === id); const j = i + d; if (j < 0 || j >= cats.length) return;
  [cats[i], cats[j]] = [cats[j], cats[i]];
  for (let k = 0; k < cats.length; k++) if (cats[k].ordre !== k + 1) { const r = await api('/api/admin/categories/' + cats[k].id, { method: 'PUT', body: { ordre: k + 1 } }); upsert(G.categories, r.categorie); }
  renderMenu();
}

async function pickImg(input, prevId, set, max) {

function renderDiscussions(keep) {
  const convs = {};
  G.chats.forEach(m => { (convs[m.clientId] = convs[m.clientId] || []).push(m); });
  const ids = Object.keys(convs).map(Number).sort((a, b) => { const la = convs[a][convs[a].length - 1], lb = convs[b][convs[b].length - 1]; return lb.at.localeCompare(la.at); });
  if (CUR_CHAT && !convs[CUR_CHAT]) convs[CUR_CHAT] = [];
  if (!CUR_CHAT && ids.length) CUR_CHAT = ids[0];
  const cl = id => byId(G.clients, id) || { nom: 'Client', tel: '' };
  const thread = CUR_CHAT ? (convs[CUR_CHAT] || []) : [];
  const input = $('th-in'); const draft = input ? input.value : ''; const hadFocus = input && document.activeElement === input;
  $('p-discussions').innerHTML = `<div class="ph-t"><div><div class="h">Discussions</div><p>Répondez aux questions des clients. Ils reçoivent votre réponse en notification.</p></div></div>
    <div class="chatw"><div class="convs">${ids.length || CUR_CHAT ? (ids.includes(CUR_CHAT) || !CUR_CHAT ? ids : [CUR_CHAT].concat(ids)).map(id => { const ms = convs[id] || []; const last = ms[ms.length - 1]; const un = ms.filter(m => m.de === 'client' && !m.lu).length; const c = cl(id); return `<div class="conv ${id === CUR_CHAT ? 'on' : ''}" onclick="openConv(${id})"><div class="av">${esc((c.nom || '?')[0].toUpperCase())}</div><div class="ci"><b>${esc(c.nom)}</b><small>${last ? esc((last.de === 'resto' ? 'Vous : ' : '') + last.texte) : 'Nouvelle discussion'}</small></div>${un ? `<span class="cnt">${un}</span>` : ''}</div>`; }).join('') : '<div class="empty">Aucune discussion.</div>'}</div>
    <div class="thread">${CUR_CHAT ? `<div class="thread-h"><span>${esc(cl(CUR_CHAT).nom)} ${cl(CUR_CHAT).tel ? `· <a href="tel:${esc(cl(CUR_CHAT).tel)}">${esc(cl(CUR_CHAT).tel)}</a>` : ''}</span><span class="badge">${G.commandes.filter(c => c.clientId === CUR_CHAT).length} commande(s)</span></div>
      <div class="msgs" id="msgs">${thread.map(m => `<div class="msg ${m.de === 'client' ? 'cl' : 're'}">${esc(m.texte)}<time>${fdt(m.at)}</time></div>`).join('') || '<div class="empty">Écrivez le premier message.</div>'}</div>
      <div class="thread-f"><input id="th-in" placeholder="Votre réponse…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">Envoyer</button></div>` : '<div class="empty" style="margin:auto">Sélectionnez une discussion.</div>'}</div></div>`;
  const ms = $('msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  const ni = $('th-in'); if (ni) { ni.value = draft; if (hadFocus || !keep) ni.focus(); }
  if (CUR_CHAT && thread.some(m => m.de === 'client' && !m.lu)) { thread.forEach(m => m.lu = true); api(`/api/admin/chat/${CUR_CHAT}/lu`, { body: {} }).catch(() => { }); badges(); }
}
function openConv(id) { CUR_CHAT = id; const i = $('th-in'); if (i) i.value = ''; renderDiscussions(); }
async function sendChat() {
  const i = $('th-in'); const t = i.value.trim(); if (!t) return;
  try { const r = await api('/api/admin/chat/' + CUR_CHAT, { body: { texte: t } }); i.value = ''; upsert(G.chats, r.message); renderDiscussions(); } catch (e) { toast('Erreur', e.message, true); }
}

// ===================================================================
// CLIENTS
// ===================================================================
let cliQ = '';
function renderClients() {
  const stats = {};
  G.commandes.forEach(c => { const s = stats[c.clientId] = stats[c.clientId] || { n: 0, t: 0, last: '' }; if (c.statut === 'terminee') { s.n++; s.t += c.total; } if (c.at > s.last) s.last = c.at; });
  const q = cliQ.toLowerCase();
  const list = G.clients.filter(c => !c.invite && (!q || (c.nom + ' ' + c.tel).toLowerCase().includes(q))).sort((a, b) => ((stats[b.id] || {}).t || 0) - ((stats[a.id] || {}).t || 0));
  $('p-clients').innerHTML = `<div class="ph-t"><div><div class="h">Clients</div><p>${list.length} client(s) inscrit(s) · classés par montant dépensé</p></div><input placeholder="Rechercher nom ou téléphone" value="${esc(cliQ)}" oninput="cliQ=this.value;renderClients();setTimeout(()=>{const i=document.querySelector('#p-clients input');i.focus();i.setSelectionRange(i.value.length,i.value.length)})" style="padding:10px 14px;border-radius:999px;border:1.5px solid var(--gris2);min-width:260px;outline:none"></div>
    <div class="card">${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Téléphone</th><th>Inscrit le</th><th class="num">Commandes</th><th class="num">Total dépensé</th><th class="num">Points</th><th>Notifications</th><th>Dernière visite</th><th></th></tr></thead><tbody>
    ${list.map(c => { const s = stats[c.id] || {}; return `<tr><td><b>${esc(c.nom)}</b></td><td><a href="tel:${esc(c.tel)}">${esc(c.tel)}</a></td><td>${c.createdAt ? fdate(c.createdAt) : ''}</td><td class="num">${s.n || 0}</td><td class="num"><b>${F(s.t)}</b></td><td class="num">${c.points}</td><td>${c.push ? '<span class="badge vert">Activées</span>' : '<span class="badge">Non</span>'}</td><td>${s.last ? fdt(s.last) : '—'}</td><td><button class="btn ghost sm" onclick="showPanel('discussions');openConv(${c.id})">Écrire</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty"><div class="shape"></div>Aucun client pour le moment.</div>'}</div>`;
}

// ===================================================================
// TABLES & QR
// ===================================================================
function baseUrl() { try { return localStorage.getItem('g_base') || location.origin; } catch (e) { return location.origin; } }
function renderTables() {
  const n = G.settings.nbTables, base = baseUrl(), r = G.settings.resto;
  const local = /localhost|127\.0\.0\.1/.test(base);
  const qr = (url) => { const q = qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); };
  $('p-tables').innerHTML = `<div class="ph-t qr-tools"><div><div class="h">Tables & QR codes</div><p>Imprimez et posez un QR code sur chaque table : le client scanne, commande, et reçoit une notification quand son plat est prêt.</p></div>
      <button class="btn big" onclick="document.body.classList.add('print-qr');window.print();setTimeout(()=>document.body.classList.remove('print-qr'),500)">Imprimer les QR codes</button></div>
    <div class="card qr-tools" style="margin-bottom:16px"><div class="row"><div class="fld" style="max-width:180px"><label>Nombre de tables</label><input type="number" id="t-n" value="${n}" min="0" max="300"></div>
      <div class="fld"><label>Adresse de l’application (celle que les clients ouvrent)</label><input id="t-base" value="${esc(base)}"></div>
      <div class="fld" style="flex:0"><button class="btn vert" onclick="saveTables()">Mettre à jour</button></div></div>
      ${local ? `<p class="hint" style="color:var(--rouge2);font-weight:600">Attention : « localhost » ne fonctionne que sur cet ordinateur. Mettez l’adresse Wi-Fi affichée au démarrage du serveur (ex. : http://192.168.1.20:3000) ou votre adresse en ligne.</p>` : ''}</div>
    <div class="qrs"><div class="qr" style="border-color:var(--rouge)"><div class="h">Menu</div>${qr(base + '/')}<p>Scannez pour commander</p><small>${esc(r.nom)} · livraison & à emporter</small></div>
      ${Array.from({ length: n }, (_, i) => `<div class="qr"><div class="h">Table ${i + 1}</div>${qr(base + '/?table=' + (i + 1))}<p>Scannez pour commander</p><small>${esc(r.nom)}</small></div>`).join('')}</div>`;
}
async function saveTables() {
  const b = $('t-base').value.trim().replace(/\/+$/, '');
  try { localStorage.setItem('g_base', b); } catch (e) { }
  try { const r = await api('/api/admin/resto', { method: 'PUT', body: { nbTables: Number($('t-n').value) } }); G.settings.nbTables = r.nbTables; render(); } catch (e) { toast('Erreur', e.message, true); }
}

// ===================================================================
// RÉGLAGES
// ===================================================================
function renderReglages() {
  const r = G.settings.resto;
  const f = (k, l, t, extra) => `<div class="fld"><label>${l}</label><input id="rg-${k}" type="${t || 'text'}" value="${esc(r[k])}" ${extra || ''}></div>`;
  $('p-reglages').innerHTML = `<div class="ph-t"><div><div class="h">Réglages</div></div></div>
    <div class="grid2" style="align-items:start">
      <div class="card"><div class="card-t">Le restaurant</div>
        ${f('nom', 'Nom affiché')}${f('slogan', 'Slogan')}${f('adresse', 'Adresse')}
        <div class="row">${f('tel', 'Téléphone')}${f('whatsapp', 'WhatsApp')}</div>
        ${f('horaires', 'Horaires (texte affiché)')}${f('email', 'E-mail de contact')}
        <div class="row">${f('lat', 'Latitude', 'number', 'step="any"')}${f('lng', 'Longitude', 'number', 'step="any"')}<div class="fld" style="flex:0"><button class="btn ghost" onclick="hereGPS()">Ma position</button></div></div>
        <p class="hint">La position sert de point de départ sur la carte de suivi des livraisons.</p></div>
      <div><div class="card"><div class="card-t">Livraison & commandes</div>
        <div class="row">${f('fraisLivraison', 'Frais de livraison (F)', 'number')}${f('minCommande', 'Commande minimum (F)', 'number')}</div>
        ${f('delai', 'Délai de livraison affiché')}${f('fuseau', 'Fuseau horaire')}</div>
      <div class="card" style="margin-top:16px"><div class="card-t">Fidélité</div>
        <div class="row">${f('pointsParMille', 'Points par 1 000 F', 'number')}${f('valeurPoint', 'Valeur d’un point (F)', 'number')}${f('seuilPoints', 'Points minimum', 'number')}</div>
        <p class="hint">Les points sont gagnés quand la commande est terminée et peuvent payer jusqu’à 50 % d’un panier.</p></div>
      <div class="mfoot"><span class="err" id="rg-err"></span><button class="btn big" onclick="saveResto()">Enregistrer les réglages</button></div>
      <div class="card" style="margin-top:16px"><div class="card-t">Sécurité</div>
        <div class="fld"><label>Mot de passe actuel</label><input id="sc-cur" type="password"></div>
        <div class="row"><div class="fld"><label>Nouvel identifiant</label><input id="sc-u" placeholder="${esc(G.settings.adminUser)}"></div><div class="fld"><label>Nouveau mot de passe</label><input id="sc-p" type="password"></div></div>
        <div class="fld"><label>Nouveau code de suppression</label><input id="sc-d" type="password"></div>
        <div class="err" id="sc-err"></div><button class="btn vert" onclick="saveSecu()">Mettre à jour</button></div></div></div>`;
}
function hereGPS() { navigator.geolocation && navigator.geolocation.getCurrentPosition(p => { $('rg-lat').value = p.coords.latitude.toFixed(6); $('rg-lng').value = p.coords.longitude.toFixed(6); }, () => toast('Position refusée', '', true)); }
async function saveResto() {
  const body = {}; ['nom', 'slogan', 'adresse', 'tel', 'whatsapp', 'horaires', 'email', 'lat', 'lng', 'fraisLivraison', 'minCommande', 'delai', 'fuseau', 'pointsParMille', 'valeurPoint', 'seuilPoints'].forEach(k => body[k] = $('rg-' + k).value);
  try { const r = await api('/api/admin/resto', { method: 'PUT', body }); G.settings.resto = r.resto; $('g-nom').textContent = r.resto.nom; toast('Réglages enregistrés', 'L’app client est à jour.'); } catch (e) { $('rg-err').textContent = e.message; }
}
async function saveSecu() {
  try { const r = await api('/api/admin/securite', { body: { currentPassword: $('sc-cur').value, newUsername: $('sc-u').value, newPassword: $('sc-p').value, newDeleteCode: $('sc-d').value } }); G.settings.adminUser = r.username; render(); toast('Accès mis à jour', ''); }
  catch (e) { $('sc-err').textContent = e.message; }
}
</script>
</body>
</html>
